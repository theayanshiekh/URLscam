version: '3.8'

services:
  url-fraud-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-fraud-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false
      - CORS_ORIGINS=*
      - THRESHOLD_OVERRIDE=0.7405
    volumes:
      - ./data:/app/data
